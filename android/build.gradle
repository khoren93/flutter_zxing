group 'com.markosyan.flutter_zxing'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.markosyan.flutter_zxing'
    }
    // Keep in step with the Flutter SDK default so apps do not fail to build
    // with "dependency requires a higher compileSdk".
    compileSdk 36
    // Pinned deliberately: zxing-cpp v2.3.0 does not compile with the libc++
    // that ships in NDK 28+, which dropped `std::char_traits<unsigned char>`
    // (`Utf.cpp` instantiates `std::basic_string_view<unsigned char>`).
    // Bumping this requires updating the `src/zxing` submodule first.
    ndkVersion "27.0.12077973"

    externalNativeBuild {
        cmake {
            path "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 23
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
}
