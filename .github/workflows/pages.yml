name: Site and demo

# Publishes https://khoren93.github.io/flutter_zxing/ to GitHub Pages:
#
#   /flutter_zxing/       the documentation site (website/, VitePress)
#   /flutter_zxing/demo/  the demo app (example/lib/main.dart) on the web
#
# The site embeds the demo next to its code samples, and shows screenshots of
# the scanner templates rendered here by test/tool/scanner_shots_test.dart.
# Old links to the demo at the root (`?tab=create`) are sent on to /demo/ by
# the site; website/public/flutter_service_worker.js removes the service
# worker an old demo build may have left at the root.
#
# Runs on every push to main and to the 4.0 development branch, and by hand
# ("Run workflow"). The repository's Pages source has to be "GitHub Actions"
# (Settings -> Pages), and every branch that publishes has to be allowed in
# the deployment rules of the `github-pages` environment (Settings ->
# Environments). Drop 4.0 here once it is merged into main.
on:
  push:
    branches:
      - main
      - "4.0"
  workflow_dispatch:

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already running is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the site and the demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          cd example && flutter pub get --enforce-lockfile

      # The WebAssembly engine is not committed: build it, with the pinned
      # Emscripten cached between runs (the same cache as the CI `web` job).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_zxing/emsdk
          key: emsdk-${{ hashFiles('tool/wasm_config.sh') }}

      - name: Build the WebAssembly engine
        run: tool/build_wasm.sh

      # dart2wasm, with the dart2js build next to it: browsers without
      # WasmGC (older Safari) load that one. The demo lives under
      # /flutter_zxing/demo/, hence the base href.
      - name: Build the demo
        run: |
          cd example
          flutter build web --release --wasm --base-href /flutter_zxing/demo/

      # The templates as the site shows them, from the package itself.
      - name: Render the template screenshots
        run: make site-shots

      - name: Build the site
        run: cd website && npm ci && npm run build

      - name: Put the demo under the site
        run: cp -R example/build/web website/.vitepress/dist/demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
