name: Flutter CI

# Trigger CI on (1) pull requests, (2) pushes to main and 4.0 and (3) manually.
#
# Pushes to the 4.0 development branch run a quick subset (about 10 minutes
# instead of 18+): lint, the engine on every desktop OS, Flutter 3.41.0, web,
# and the integration tests on Linux and Android. Pull requests, main and
# manual runs ("Run workflow", any branch) add the iOS, macOS and Windows
# integration tests and the example builds.
on:
  pull_request:
  push:
    branches:
      - main
      - "4.0"
  workflow_dispatch:

# A new push or pull request update cancels the run still going for the same
# branch or pull request (by number: forks may use the same branch name), to
# save resources. Every push to main is still tested on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The workflow reads the repository; `actions: write` lets a failed job cancel
# the rest of the run (the last step of every job). Actions from outside
# GitHub are pinned by commit: a moved tag cannot run new code with this
# token; dependabot updates the pins.
permissions:
  contents: read
  actions: write

jobs:
  # Job for linting, formatting and unit testing Dart code
  lint:
    name: "Lint and Format Dart Code"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout the repository. With zxing-cpp: `flutter test` runs the
      # package's build hook even for tests that never call the engine.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Install Flutter SDK
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      # The apps resolve against their committed lockfiles; the plugin's own
      # lockfile is git-ignored, as it should be for a published package.
      - name: Get dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get --enforce-lockfile)
          (cd zxscanner && flutter pub get --enforce-lockfile)
          (cd tool && dart pub get --enforce-lockfile)

      # Format code and check for issues
      - name: Run Dart format
        run: dart format --set-exit-if-changed .

      - name: Analyze Dart code
        run: |
          for dir in . example zxscanner; do
            (cd "$dir" && flutter analyze --no-pub)
          done

      # Unit and widget tests of the plugin itself. They mock the camera and
      # never call into FFI, so they need no native build and run in seconds.
      # The tests tagged `native` run the real engine; the `engine` job runs
      # them on every desktop OS. zxscanner/ only holds a placeholder test.
      - name: Run unit tests
        run: flutter test --exclude-tags native

      # The demo's and the diagnostics page's widget tests, on a fake camera.
      - name: Run the example's tests
        run: cd example && flutter test

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The package as pub.dev gets it: `pub publish --dry-run` validates it, and
  # the example builds from the files it would upload, so a file .pubignore
  # leaves out but the package or its example needs fails here.
  package:
    name: "Package"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Validate and pack the package
        run: |
          flutter pub get
          cd tool && dart pub get --enforce-lockfile
          dart run pack_package.dart ../build/package

      - name: Build the example from the package
        run: cd build/package/example && flutter pub get && flutter build bundle

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The test corpus is generated from zxing-cpp's samples (the submodule), not
  # committed: once here, then handed to every job that reads it. libwebp's
  # dwebp converts the WebP samples, like zxing-cpp's own tests decode them.
  fixtures:
    name: "Test corpus"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Install libwebp tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Generate the corpus
        run: cd tool && dart pub get --enforce-lockfile && dart run make_fixtures.dart

      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: |
            build/fixtures/corpus
            example/assets/fixtures/corpus
          retention-days: 3
          if-no-files-found: error

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The engine on the host: hook/build.dart compiles it from scratch (no cache
  # on a fresh runner), then the engine tests and the fixture corpus run
  # against it. The clean build time goes to the job summary.
  engine:
    name: "Engine (${{ matrix.os }})"
    needs: fixtures
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # The corpus generated by the `fixtures` job.
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: .

      - name: Run engine tests (clean hook build)
        shell: bash
        run: |
          START=$(date +%s)
          flutter test --tags native
          echo "Clean engine build + tests on ${{ matrix.os }}: $(( $(date +%s) - START )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The hook on the lowest supported Flutter. Flutter 3.41 pins meta 1.17, so
  # pub resolves older hooks / code_assets / native_toolchain_c there, and
  # hook/build.dart has to compile with those (see pubspec.yaml).
  engine-min-sdk:
    name: "Engine on Flutter 3.41.0"
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          flutter pub deps --style=compact | grep -E "^- (hooks|code_assets|native_toolchain_c) "

      # The corpus generated by the `fixtures` job.
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: .

      - name: Run engine tests
        run: flutter test --tags native

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The engine in the browser: the example's corpus runner and the scanner
  # (a video file as the camera), built with dart2js and with dart2wasm, in
  # headless Chrome.
  web:
    name: "Web (Chrome)"
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      # Node and Chrome come with the runner image.
      - name: Get dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get --enforce-lockfile)
          (cd tool && npm ci)

      # The WebAssembly engine is not committed: build it, with the pinned
      # Emscripten cached between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_zxing/emsdk
          key: emsdk-${{ hashFiles('tool/wasm_config.sh') }}

      - name: Build the WebAssembly engine
        run: tool/build_wasm.sh

      # The corpus generated by the `fixtures` job.
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: .

      - name: Corpus (dart2js)
        run: |
          (cd example && flutter build web -t lib/corpus_web.dart)
          node tool/web_corpus_test.mjs example/build/web dart2js

      - name: Corpus (dart2wasm)
        run: |
          (cd example && flutter build web --wasm -t lib/corpus_web.dart)
          node tool/web_corpus_test.mjs example/build/web dart2wasm

      # ffmpeg turns a zxing-cpp sample into the y4m video Chrome's fake
      # camera plays.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Scanner (dart2js)
        run: |
          (cd example && flutter build web -t lib/scanner_web.dart)
          node tool/web_scanner_test.mjs example/build/web dart2js

      - name: Scanner (dart2wasm)
        run: |
          (cd example && flutter build web --wasm -t lib/scanner_web.dart)
          node tool/web_scanner_test.mjs example/build/web dart2wasm

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Build the example application for the targets whose build is NOT already
  # covered by the test jobs below:
  #   * android - `flutter build appbundle` compiles the native code for every
  #     ABI (arm64-v8a, armeabi-v7a, x86_64), while the emulator tests only ever
  #     build x86_64.
  #   * ios - this builds the device (iphoneos) slice, while the integration
  #     tests only build for the simulator (iphonesimulator).
  # macOS, Linux and Windows are intentionally missing: `flutter test
  # integration_test -d <device>` performs the very same debug build there, so a
  # separate build job would only burn CI minutes.
  build-example:
    name: 'Build example (${{ matrix.target }}, ${{ matrix.os }})'
    # Not in the quick subset of 4.0 pushes, see the top of the file.
    if: github.event_name != 'push' || github.ref_name != '4.0'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu
          - target: ios
            os: macos
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Android-specific setup
      - name: Setup Java for Android (${{ matrix.target }}, ${{ matrix.os }})
        if: matrix.target == 'android'
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 17
          distribution: temurin

      # Reuse the Gradle cache between runs, the appbundle build is the slowest
      # job in this workflow
      - name: Setup Gradle cache for Android
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Install Flutter SDK
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      # The example resolves against its committed lockfile; the plugin's own
      # lockfile is git-ignored.
      - name: Get dependencies
        run: |
          flutter pub get
          cd example && flutter pub get --enforce-lockfile

      - name: Build example for ${{ matrix.target }} on ${{ matrix.os }}
        shell: bash
        run: |
          cd example
          TARGET=${{ matrix.target }}

          case $TARGET in
            ios)
              flutter build ios --debug --no-codesign
              ;;
            android)
              flutter build appbundle --debug
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Integration tests for all platforms except Android (handled separately).
  # These also compile the example app from scratch, which is why macOS, Linux
  # and Windows have no separate build job.
  test-example:
    name: 'Test example (${{ matrix.target }}, ${{ matrix.os }})'
    needs: fixtures
    runs-on: ${{ matrix.os }}-latest
    # The iOS simulator run alone needs ~12 minutes, and a run that hangs is
    # stopped after 12 more and retried (see scripts/run_integration_tests.sh)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 4.0 pushes: Linux only (see the top of the file); otherwise iOS,
        # macOS, Linux and Windows.
        include: >-
          ${{ fromJSON(github.event_name == 'push' && github.ref_name == '4.0'
          && '[{"target":"linux","os":"ubuntu","device":"linux"}]'
          || '[{"target":"ios","os":"macos","device":"iphone"},
          {"target":"macos","os":"macos","device":"macos"},
          {"target":"linux","os":"ubuntu","device":"linux"},
          {"target":"windows","os":"windows","device":"windows"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Install Flutter SDK
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      # The example resolves against its committed lockfile; the plugin's own
      # lockfile is git-ignored.
      - name: Get dependencies
        run: |
          flutter pub get
          cd example && flutter pub get --enforce-lockfile

      # Linux-specific dependencies
      - name: Install dependencies for Flutter on Linux (${{ matrix.target }}, ${{ matrix.os }})
        if: matrix.target == 'linux' && matrix.os == 'ubuntu'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake dbus libblkid-dev libgtk-3-dev liblzma-dev ninja-build \
            pkg-config xvfb network-manager upower \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # Launch iOS Simulator for iOS tests
      - name: Launch iOS Simulator for ${{ matrix.target }}
        if: matrix.target == 'ios'
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes \
            | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*" \
            | sort -V | tail -n 1)

          # Pick the newest plain iPhone shipped with the installed Xcode
          # instead of hardcoding a model Apple can drop at any time
          DEVICE_TYPES=$(xcrun simctl list devicetypes \
            | grep -o "com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9A-Za-z-]*")
          DEVICE_TYPE=$(echo "$DEVICE_TYPES" | grep -E "iPhone-[0-9]+$" | sort -V | tail -n 1)
          if [ -z "$DEVICE_TYPE" ]; then
            DEVICE_TYPE=$(echo "$DEVICE_TYPES" | sort -V | tail -n 1)
          fi

          echo "Using runtime: $RUNTIME_ID, device type: $DEVICE_TYPE"
          simulator_id=$(xcrun simctl create iphone-zxing "$DEVICE_TYPE" "$RUNTIME_ID")
          xcrun simctl boot "$simulator_id"
          # Wait for the boot to finish, otherwise the tests may attach to a
          # simulator that is not ready yet
          xcrun simctl bootstatus "$simulator_id" -b

      # The corpus generated by the `fixtures` job.
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: .

      # Run tests
      - name: Run tests for ${{ matrix.target }} on ${{ matrix.os }}
        shell: bash
        run: |
          scripts/run_integration_tests.sh "${{ matrix.device }}"

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Integration tests on Android emulator
  test-example-android:
    name: 'Test example on Android API level ${{ matrix.api-level }}'
    needs: fixtures
    runs-on: ubuntu-latest
    # Creating the AVD snapshot on a cache miss can eat most of the budget
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One level, the newest: older ones (24, 34) were dropped during 4.0
        # development to keep CI short.
        include:
          - api-level: 36
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java for Android (${{ matrix.api-level }})
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 17
          distribution: temurin

      # Install Flutter SDK
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      # The example resolves against its committed lockfile; the plugin's own
      # lockfile is git-ignored.
      - name: Get dependencies
        run: |
          flutter pub get
          cd example && flutter pub get --enforce-lockfile

      # The corpus generated by the `fixtures` job.
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: .

      # Enable KVM for Android emulators
      - name: Enable KVM for Android emulators (${{ matrix.api-level }})
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup AVD actions/cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # target and arch are part of the key, a cached AVD is only valid for
          # the exact image it was created from. Bump the version to drop
          # broken snapshots (v2: the API 24 snapshot booted to an offline
          # device from 2026-11-09 on).
          key: avd-v2-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create and cache AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Create and run Android emulator
      - name: Run tests on Android API level ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            flutter devices
            scripts/run_integration_tests.sh

      # The first failure stops the whole run: the other jobs would only burn
      # CI minutes on a run that has already failed.
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
