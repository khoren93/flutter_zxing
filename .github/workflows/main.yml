name: Flutter CI

# Trigger CI on (1) pull requests, (2) pushes to main branch and (3) manually
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel previous workflows for the same pull request to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The workflow only ever reads the repository
permissions:
  contents: read

jobs:
  # Job for linting, formatting and unit testing Dart code
  lint:
    name: "Lint and Format Dart Code"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checkout the repository
      - uses: actions/checkout@v7

      # Install Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Setup Melos for workspace management
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      # Format code and check for issues
      - name: Run Dart format
        run: dart format --set-exit-if-changed .

      - name: Analyze Dart code
        run: melos exec -- dart analyze .

      # Unit and widget tests of the plugin itself. They mock the camera and
      # never call into FFI, so they need no native build and run in seconds.
      # example/ and zxscanner/ only hold placeholder test files, so `melos exec`
      # is deliberately not used here.
      - name: Run unit tests
        run: flutter test

  # Build the example application for the targets whose build is NOT already
  # covered by the test jobs below:
  #   * android - `flutter build appbundle` compiles the native code for every
  #     ABI (arm64-v8a, armeabi-v7a, x86_64), while the emulator tests only ever
  #     build x86_64.
  #   * ios - this builds the device (iphoneos) slice, while the integration
  #     tests only build for the simulator (iphonesimulator).
  # macOS, Linux and Windows are intentionally missing: `flutter test
  # integration_test -d <device>` performs the very same debug build there, so a
  # separate build job would only burn CI minutes.
  build-example:
    name: 'Build example (${{ matrix.target }}, ${{ matrix.os }})'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu
          - target: ios
            os: macos
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # iOS specific setup
      - name: Copy ZXing source files for iOS
        if: matrix.target == 'ios'
        run: ./scripts/update_ios_macos_src.sh

      # Android-specific setup
      - name: Setup Java for Android (${{ matrix.target }}, ${{ matrix.os }})
        if: matrix.target == 'android'
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: temurin

      # Reuse the Gradle cache between runs, the appbundle build is the slowest
      # job in this workflow
      - name: Setup Gradle cache for Android
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v6

      # Install Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Setup Melos for workspace management
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      - name: Build example for ${{ matrix.target }} on ${{ matrix.os }}
        shell: bash
        run: |
          cd example
          TARGET=${{ matrix.target }}

          case $TARGET in
            ios)
              flutter build ios --debug --no-codesign
              ;;
            android)
              flutter build appbundle --debug
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac

  # Integration tests for all platforms except Android (handled separately).
  # These also compile the example app from scratch, which is why macOS, Linux
  # and Windows have no separate build job.
  test-example:
    name: 'Test example (${{ matrix.target }}, ${{ matrix.os }})'
    runs-on: ${{ matrix.os }}-latest
    # The iOS simulator run alone needs ~12 minutes, and a run that hangs is
    # stopped after 12 more and retried (see scripts/run_integration_tests.sh)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios
            os: macos
            device: iphone
          - target: macos
            os: macos
            device: macos
          - target: linux
            os: ubuntu
            device: linux
          - target: windows
            os: windows
            device: windows
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # iOS/macOS specific setup
      - name: Copy ZXing source files for iOS/macOS
        if: matrix.target == 'ios' || matrix.target == 'macos'
        run: ./scripts/update_ios_macos_src.sh

      # Install Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Setup Melos
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      # Linux-specific dependencies
      - name: Install dependencies for Flutter on Linux (${{ matrix.target }}, ${{ matrix.os }})
        if: matrix.target == 'linux' && matrix.os == 'ubuntu'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake dbus libblkid-dev libgtk-3-dev liblzma-dev ninja-build \
            pkg-config xvfb network-manager upower \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # Launch iOS Simulator for iOS tests
      - name: Launch iOS Simulator for ${{ matrix.target }}
        if: matrix.target == 'ios'
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes \
            | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*" \
            | sort -V | tail -n 1)

          # Pick the newest plain iPhone shipped with the installed Xcode
          # instead of hardcoding a model Apple can drop at any time
          DEVICE_TYPES=$(xcrun simctl list devicetypes \
            | grep -o "com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9A-Za-z-]*")
          DEVICE_TYPE=$(echo "$DEVICE_TYPES" | grep -E "iPhone-[0-9]+$" | sort -V | tail -n 1)
          if [ -z "$DEVICE_TYPE" ]; then
            DEVICE_TYPE=$(echo "$DEVICE_TYPES" | sort -V | tail -n 1)
          fi

          echo "Using runtime: $RUNTIME_ID, device type: $DEVICE_TYPE"
          simulator_id=$(xcrun simctl create iphone-zxing "$DEVICE_TYPE" "$RUNTIME_ID")
          xcrun simctl boot "$simulator_id"
          # Wait for the boot to finish, otherwise the tests may attach to a
          # simulator that is not ready yet
          xcrun simctl bootstatus "$simulator_id" -b

      # Run tests
      - name: Run tests for ${{ matrix.target }} on ${{ matrix.os }}
        shell: bash
        run: |
          scripts/run_integration_tests.sh "${{ matrix.device }}"

  # Integration tests on Android emulator
  test-example-android:
    name: 'Test example on Android API level ${{ matrix.api-level }}'
    runs-on: ubuntu-latest
    # Creating the AVD snapshot on a cache miss can eat most of the budget
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64
          - api-level: 36
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java for Android (${{ matrix.api-level }})
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: temurin

      # Install Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Setup Melos
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      # Enable KVM for Android emulators
      - name: Enable KVM for Android emulators (${{ matrix.api-level }})
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle cache
      - uses: gradle/actions/setup-gradle@v6

      - name: Setup AVD actions/cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # target and arch are part of the key, a cached AVD is only valid for
          # the exact image it was created from
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create and cache AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Create and run Android emulator
      - name: Run tests on Android API level ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            flutter devices
            scripts/run_integration_tests.sh
