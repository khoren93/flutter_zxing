name: flutter_zxing
description: A barcode scanner and generator natively in Flutter with Dart FFI based on ZXing.
version: 2.4.0
repository: https://github.com/khoren93/flutter_zxing

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.41.0"

dependencies:
  camera: ">=0.10.5 <0.13.0"
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  image: ^4.1.0
  image_picker: ^1.0.0

dev_dependencies:
  # Used by the tests to build synthetic camera frames.
  camera_platform_interface: ^2.7.0
  ffigen: ">=12.0.0 <22.0.0" # dart run ffigen --config ffigen.yaml
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  melos: ">=5.0.0 <9.0.0"

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

# Publish to pub.dev
# The iOS/macOS sources are generated and git-ignored, so they must be refreshed
# before publishing or the released package will not build on those platforms:
# ./scripts/update_ios_macos_src.sh
# flutter pub publish --dry-run
# flutter pub publish

# Update zxing-cpp submodule
# git submodule update --remote
