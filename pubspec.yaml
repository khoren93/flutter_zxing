name: flutter_zxing
description: Scan 32 barcode formats and create 30, QR codes included, on Android, iOS, macOS, Linux, Windows and the web with zxing-cpp. No ML Kit, no Play services.
version: 4.0.0
homepage: https://khoren93.github.io/flutter_zxing/
repository: https://github.com/khoren93/flutter_zxing
issue_tracker: https://github.com/khoren93/flutter_zxing/issues
documentation: https://khoren93.github.io/flutter_zxing/
topics:
  - barcode
  - qrcode
  - scanner
  - camera
  - zxing

# Declared: pub.dev would otherwise take the platforms of `camera` (Android,
# iOS, web). Reading and creating work everywhere; the desktop camera comes
# from camera_desktop, which the app adds (README, "Camera on desktop").
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  # 0.11.2 is the floor on purpose: it is the first release that exports
  # CameraLensType, which the scanner uses to switch to an iPhone's ultra-wide
  # camera to focus close up. Android runs on CameraX since 0.11.0; the older
  # camera2 implementation crashed inside `io.flutter.plugins.camera.Camera`
  # on a number of devices, and nothing in this plugin can work around that.
  camera: ">=0.11.2 <0.13.0"
  # The camera's errors as a stream: CameraController keeps only the first.
  camera_platform_interface: ^2.10.0
  # Build hooks (hook/build.dart). Ranges, not the latest only: on Flutter
  # 3.41, which pins meta 1.17, pub resolves code_assets 1.2.1, hooks 2.0.2
  # and native_toolchain_c 0.19.2 (0.19.3+ and hooks 2.1 need meta ^1.19),
  # and the hook has to compile with those. CI checks it on Flutter 3.41.0.
  code_assets: ">=1.2.1 <3.0.0"
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ">=2.0.2 <3.0.0"
  image: ^4.1.0
  image_picker: ^1.0.0
  # Plurals and dates of the scanner's texts (ScannerLocalizations).
  # flutter_localizations, which apps use next to it, pins intl: 0.20.2 on
  # Flutter 3.41, ^0.20.3 later; any 0.20 matches both.
  intl: ">=0.20.2 <0.21.0"
  logging: ^1.3.0
  native_toolchain_c: ">=0.19.2 <0.20.0"
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

flutter:
  # The WebAssembly engine and its worker. Web builds only: the platform
  # filter keeps them out of Android, iOS and desktop apps.
  assets:
    - path: assets/web/
      platforms: [web]

# Publish to pub.dev
# make publish        (or: ./scripts/publish.sh [--dry-run] [--force])
# Bump this version together with the CHANGELOG entry first; the script checks
# that the CHANGELOG documents it, builds the WebAssembly engine -- it is
# git-ignored, and without it the released package does not work on the web --
# then publishes.

# Update zxing-cpp: see "Updating zxing-cpp" in CONTRIBUTING.md.
