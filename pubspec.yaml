name: flutter_zxing
description: Scan and create QR codes and 40+ barcode formats on Android, iOS, macOS, Linux, Windows and the web with zxing-cpp. No ML Kit, no Play services.
version: 4.0.0-rc.2
homepage: https://khoren93.github.io/flutter_zxing/
repository: https://github.com/khoren93/flutter_zxing
issue_tracker: https://github.com/khoren93/flutter_zxing/issues
documentation: https://github.com/khoren93/flutter_zxing/tree/main/doc
topics:
  - barcode
  - qrcode
  - scanner
  - camera
  - zxing

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  # 0.11.0 is the floor on purpose: it is where `camera` switched Android over
  # to CameraX. The older camera2 implementation crashed inside
  # `io.flutter.plugins.camera.Camera` on a number of devices, and nothing in
  # this plugin can work around that.
  camera: ">=0.11.0 <0.13.0"
  # Build hooks (hook/build.dart). Ranges, not the latest only: on Flutter
  # 3.41, which pins meta 1.17, pub resolves code_assets 1.2.1, hooks 2.0.2
  # and native_toolchain_c 0.19.2 (0.19.3+ and hooks 2.1 need meta ^1.19),
  # and the hook has to compile with those. CI checks it on Flutter 3.41.0.
  code_assets: ">=1.2.1 <3.0.0"
  # 2.10 tells the lenses of a side apart (CameraLensType): the scanner
  # switches to an iPhone's ultra-wide camera to focus close up.
  camera_platform_interface: ">=2.10.0 <3.0.0"
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ">=2.0.2 <3.0.0"
  image: ^4.1.0
  image_picker: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ">=0.19.2 <0.20.0"
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

flutter:
  # The WebAssembly engine and its worker. Web builds only: the platform
  # filter keeps them out of Android, iOS and desktop apps.
  assets:
    - path: assets/web/
      platforms: [web]

# Publish to pub.dev
# make publish        (or: ./scripts/publish.sh [--dry-run] [--force])
# Bump this version together with the CHANGELOG entry first; the script checks
# that the CHANGELOG documents it, builds the WebAssembly engine -- it is
# git-ignored, and without it the released package does not work on the web --
# then publishes.

# Update zxing-cpp submodule
# git submodule update --remote
