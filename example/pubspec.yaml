name: flutter_zxing_example
description: Demonstrates how to use the flutter_zxing plugin.
version: 0.0.1
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Material's, Cupertino's and the widgets' texts in Russian, so that the
  # demo follows a Russian device (the scanner's texts need nothing).
  flutter_localizations:
    sdk: flutter
  flutter_zxing:
    path: ../
  # The diagnostics' load ladder opens the camera without the scanner.
  camera: ">=0.11.2 <0.13.0"
  camera_desktop: ^2.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  # Create → Many codes: a CSV file to read the codes from, and the codes
  # shared as one ZIP.
  file_selector: ^1.1.0
  archive: ^4.7.1

dev_dependencies:
  # The ReaderWidget integration tests stand in a fake camera.
  camera_platform_interface: ^2.7.0
  flutter_lints: ^6.0.0
  image: ^4.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  # The fixture corpus of the engine tests (integration_test/corpus_test.dart
  # and lib/corpus_web.dart, and the package's test/engine/corpus_test.dart).
  assets:
    - assets/fixtures/corpus/
    - assets/fixtures/corpus_expected.json
    # The Use cases tab shows each case's file as it is.
    - lib/use_cases/
