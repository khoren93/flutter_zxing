name: flutter_zxing_example
description: Demonstrates how to use the flutter_zxing plugin.
version: 0.0.1
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_zxing:
    path: ../
  camera_desktop: ^1.2.2

dev_dependencies:
  # The ReaderWidget integration tests stand in a fake camera.
  camera_platform_interface: ^2.7.0
  flutter_lints: ^6.0.0
  image: ^4.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
